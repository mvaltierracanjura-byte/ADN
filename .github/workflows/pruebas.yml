# Corre las tres suites en cada push y pull request: lógica y servidor, base de datos (PGlite) y navegador (Playwright).
name: Pruebas
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lógica y servidor
        run: node --test pruebas/*.test.mjs
      - name: Base de datos
        run: |
          mkdir -p "$RUNNER_TEMP/adn-deps" && cd "$RUNNER_TEMP/adn-deps" && npm init -y >/dev/null && npm i --no-audit --no-fund @electric-sql/pglite@0.5.8
          cd "$GITHUB_WORKSPACE" && ADN_DEPS="$RUNNER_TEMP/adn-deps" node supabase/test-schema.mjs
      - name: Navegador
        run: |
          npm i -g --no-audit --no-fund playwright@1.56.1
          npx -y playwright@1.56.1 install --with-deps chromium
          NODE_PATH="$(npm root -g)" node pruebas/sitio.mjs
